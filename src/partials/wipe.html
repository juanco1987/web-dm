<!-- Cortina de Transición — Puertacces -->
<div class="page-transition-wipe" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 9999; transform: translate3d(0, 100%, 0); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none;">

    <div class="transition-door-scene" style="display: none; align-items: center; justify-content: center;">

        <div class="door-master-container">

            <div class="door-brand-text">PUERTA<span class="door-brand-accent">CCES</span></div>

            <!-- Puerta SVG Premium (resto de páginas) -->
            <div class="door-visual door-visual--svg door-wrapper">

                <!-- Fondo/Pared interior detrás de la puerta -->
                <svg viewBox="0 0 100 160" style="
                    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                    overflow: visible; pointer-events: none; z-index: 0;
                ">
                    <defs>
                        <linearGradient id="innerWall" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#0d1f2d;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#05101a;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <!-- Pared interior visible cuando la puerta se abre -->
                    <rect x="8" y="5" width="84" height="150" fill="url(#innerWall)" rx="4"/>
                </svg>

                <!-- Marco de puerta -->
                <svg viewBox="0 0 100 160" style="
                    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                    overflow: visible; pointer-events: none; z-index: 2;
                ">
                    <defs>
                        <filter id="frameGlow">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
                        </filter>
                    </defs>
                    <!-- Marco exterior principal -->
                    <rect x="8" y="5" width="84" height="150" rx="4" fill="none" 
                          stroke="rgba(100,255,218,0.5)" stroke-width="2.5"/>
                    
                    <!-- Borde interno oscuro para profundidad -->
                    <rect x="9.5" y="6.5" width="81" height="147" rx="3" fill="none" 
                          stroke="rgba(0,0,0,0.9)" stroke-width="1"/>
                    
                    <!-- Línea de brillo en marco superior (efecto biselado) -->
                    <line x1="10" y1="7" x2="90" y2="7" 
                          stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
                </svg>

                <!-- Panel de puerta animado con profundidad 3D -->
                <div class="door-panel" style="
                    position: absolute; top: 5%; left: 12%; width: 76%; height: 90%;
                    transform-origin: 0% 50%;
                    will-change: transform;
                    z-index: 3;
                    filter: drop-shadow(0 0 0 rgba(0,0,0,0));
                ">
                    <!-- Espesor de la puerta (lado izquierdo) -->
                    <div style="
                        position: absolute; left: -2px; top: 0; bottom: 0; width: 2px;
                        background: linear-gradient(90deg, #000 0%, transparent 100%);
                        opacity: 0;
                        will-change: opacity;
                    " class="door-edge-shadow"></div>

                    <svg viewBox="0 0 76 152" style="width:100%; height:100%; display:block; filter: drop-shadow(-0.5px 0 0 rgba(0,0,0,0.3));">
                        <defs>
                            <linearGradient id="doorPanel" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#0f2a3d;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#1d4460;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#0f2a3d;stop-opacity:1" />
                            </linearGradient>
                            <radialGradient id="glassShine" cx="30%" cy="20%">
                                <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
                                <stop offset="50%" style="stop-color:#64ffda;stop-opacity:0.12" />
                                <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
                            </radialGradient>
                            <filter id="glassEffect">
                                <feGaussianBlur in="SourceGraphic" stdDeviation="0.7"/>
                            </filter>
                        </defs>
                        <!-- Panel principal con gradiente mejorado -->
                        <rect x="0" y="0" width="76" height="152" rx="2" fill="url(#doorPanel)"/>
                        
                        <!-- Borde metálico principal -->
                        <rect x="0.5" y="0.5" width="75" height="151" rx="2" fill="none" 
                              stroke="rgba(100,255,218,0.7)" stroke-width="1.5"/>
                        
                        <!-- Borde interior más oscuro -->
                        <rect x="2" y="2" width="72" height="148" rx="1.5" fill="none" 
                              stroke="rgba(0,0,0,0.6)" stroke-width="0.8"/>
                        
                        <!-- Ventana superior con cristal realista -->
                        <g filter="url(#glassEffect)">
                            <rect x="8" y="12" width="60" height="50" rx="2" 
                                  fill="#051825" stroke="rgba(100,255,218,0.6)" stroke-width="1.8"/>
                            <rect x="9" y="13" width="58" height="48" rx="1.5" 
                                  fill="url(#glassShine)" opacity="0.7"/>
                            <!-- Reflejo interior del cristal -->
                            <ellipse cx="30" cy="25" rx="18" ry="12" 
                                     fill="rgba(255,255,255,0.08)" opacity="0.4"/>
                        </g>
                        
                        <!-- Ventana inferior -->
                        <g filter="url(#glassEffect)">
                            <rect x="8" y="76" width="60" height="60" rx="2" 
                                  fill="#051825" stroke="rgba(100,255,218,0.6)" stroke-width="1.8"/>
                            <rect x="9" y="77" width="58" height="58" rx="1.5" 
                                  fill="url(#glassShine)" opacity="0.6"/>
                            <ellipse cx="30" cy="105" rx="20" ry="15" 
                                     fill="rgba(255,255,255,0.08)" opacity="0.3"/>
                        </g>
                        
                        <!-- Manija de lujo -->
                        <g>
                            <!-- Base manija (soporte) -->
                            <rect x="57" y="80" width="12" height="18" rx="1" 
                                  fill="none" stroke="rgba(100,255,218,0.3)" stroke-width="0.8" opacity="0.6"/>
                            <!-- Círculo manija -->
                            <circle cx="64" cy="85" r="6" fill="none" stroke="#64ffda" stroke-width="1.8"/>
                            <!-- Centro manija brillante -->
                            <circle cx="64" cy="85" r="2.8" fill="#64ffda" opacity="0.8"/>
                            <!-- Destello en manija -->
                            <circle cx="61" cy="82" r="1.2" fill="rgba(255,255,255,0.6)"/>
                        </g>
                        
                        <!-- Luz ambiental dinámica en la puerta -->
                        <rect x="0" y="0" width="76" height="152" rx="2" 
                              fill="url(#glassShine)" opacity="0.3"/>
                    </svg>
                </div>

                <!-- Luz de ambiente dinámico (brillo lateral) -->
                <div class="door-light" style="
                    position: absolute; top: 2%; left: 5%; width: 90%; height: 96%;
                    background: radial-gradient(ellipse 45% 85% at 25% 45%, 
                        rgba(100,255,218,0.4) 0%, 
                        rgba(100,255,218,0.12) 35%, 
                        transparent 75%);
                    opacity: 0; pointer-events: none; border-radius: 4px;
                    filter: blur(12px);
                    will-change: opacity;
                "></div>

                <!-- Efecto de destello dinámico mejorado -->
                <div style="
                    position: absolute; top: 8%; left: 10%; width: 55%; height: 40%;
                    background: linear-gradient(125deg, 
                        rgba(255,255,255,0.5) 0%, 
                        rgba(255,255,255,0.15) 40%,
                        transparent 70%);
                    opacity: 0; pointer-events: none; border-radius: 3px;
                    filter: blur(4px);
                    will-change: opacity;
                "></div>

            </div>

            <!-- Puerta Lottie (automatismos) -->
            <div class="door-visual door-visual--lottie door-lottie-wrap" hidden>
                <div class="door-wipe-lottie" aria-hidden="true"></div>
            </div>

        </div>

    </div>

</div>
